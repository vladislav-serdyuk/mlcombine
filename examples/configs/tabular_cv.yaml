# Табличные данные — CatBoost + CV + Optuna-тюнинг
version: "1.0"
data:
  train_df: "train.csv"
  test_df: "test.csv"
  target_col: "target"
  task_type: classification
model:
  - provider: "tuner"
    params:
      n_trials: 50
      target_provider: "catboost"
      target_params:
        iterations: 3000
        od_wait: 200
      search_space:
        depth: { type: "int", low: 4, high: 10 }
        learning_rate: { type: "float", low: 0.01, high: 0.3, log: true }
      evaluator: "cv"
      tune_metric: "f1"
      evaluator_params:
        n_folds: 3
        stratified: true
trainer:
  output_dir: outputs
  output_file: outputs/submission.csv
step_config:
  split:
    val_fraction: 0.2
    stratified: true
handling:
  numbers:
    impute: median
    scale: robust
  categories:
    encode: ordinal
