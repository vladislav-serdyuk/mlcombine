# Загрузка датасета по URL + CatBoost
version: "1.0"
data:
  train_df: "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
  test_df: "https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv"
  target_col: "Survived"
  task_type: classification
force_types:
  Pclass: "category"
  Sex: "category"
  Embarked: "category"
model:
  - provider: "catboost"
    params:
      objective: "F1"
      iterations: 3000
      depth: 8
      learning_rate: 0.05
handling:
  numbers:
    impute: median
    scale: robust
  categories:
    encode: ordinal
trainer:
  output_dir: outputs
  output_file: outputs/submission.csv
